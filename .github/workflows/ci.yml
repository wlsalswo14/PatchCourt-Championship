name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/e2e
      - run: npm --workspace @patchcourt/web run sync:replay
      - name: Assert verified replay copies are committed exactly
        run: git status --porcelain --untracked-files=all -- apps/web/src/data apps/web/public/evidence | awk 'END { exit(NR != 0) }'
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm --workspace @patchcourt/web run test:e2e
      - run: npm --workspace @patchcourt/web run test:e2e:live-states
      - name: Assert tests did not mutate curated evidence or design proof
        run: git status --porcelain --untracked-files=all -- docs/evidence/latest docs/evidence/rejection apps/web/src/data apps/web/public/evidence design/final | awk 'END { exit(NR != 0) }'
      - run: node benchmark/verify-receipt.mjs docs/evidence/latest/receipt.json
      - run: node benchmark/verify-receipt.mjs docs/evidence/rejection/receipt.json

  build-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm --workspace @patchcourt/web run sync:replay
      - name: Assert deployed replay bytes match committed verified evidence
        run: git status --porcelain --untracked-files=all -- apps/web/src/data apps/web/public/evidence | awk 'END { exit(NR != 0) }'
      - run: npm run build:web
        env:
          VITE_API_BASE_URL: ""
          VITE_PATCHCOURT_TARGET_URL: "http://127.0.0.1:4173"
          VITE_PUBLIC_REPLAY_ONLY: "true"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
